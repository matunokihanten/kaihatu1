        let currentCategory = 'すべて';
        let searchQuery = '';

        const gridElement = document.getElementById('linksGrid');
        const searchInput = document.getElementById('searchInput');
        const noResultsElement = document.getElementById('noResults');
        const resultsCountElement = document.getElementById('resultsCount');
        const tabButtons = document.querySelectorAll('.tab-btn');

        function renderLinks() {
            gridElement.innerHTML = '';
            
            // フィルタリング処理
            const filtered = linksData.filter(link => {
                const matchCategory = currentCategory === 'すべて' || link.category === currentCategory;
                const matchSearch = link.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                    link.url.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCategory && matchSearch;
            });

            // 結果件数表示
            resultsCountElement.textContent = `表示中: ${filtered.length} 件`;

            if (filtered.length === 0) {
                gridElement.classList.add('hidden');
                noResultsElement.classList.remove('hidden');
                noResultsElement.classList.add('flex');
            } else {
                gridElement.classList.remove('hidden');
                noResultsElement.classList.add('hidden');
                noResultsElement.classList.remove('flex');
                
                filtered.forEach(link => {
                    const card = document.createElement('a');
                    card.href = link.url;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                    card.className = 'link-card block bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-5 group flex flex-col h-full';
                    
                    // アイコンカラーの動的設定
                    let iconBg = 'bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400';
                    if (link.category === '仕事系') iconBg = 'bg-emerald-100 dark:bg-emerald-900/50 text-emerald-600 dark:text-emerald-400';
                    if (link.category === 'ゲーム系') iconBg = 'bg-amber-100 dark:bg-amber-900/50 text-amber-600 dark:text-amber-400';

                    card.innerHTML = `
                        <div class="flex items-start justify-between mb-3">
                            <div class="p-2 rounded-lg ${iconBg}">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                                </svg>
                            </div>
                            <span class="inline-flex items-center rounded-md bg-slate-100 dark:bg-slate-700 px-2 py-1 text-xs font-medium text-slate-600 dark:text-slate-300 ring-1 ring-inset ring-slate-500/10 dark:ring-slate-400/20">
                                ${link.category}
                            </span>
                        </div>
                        <h3 class="text-base font-bold text-slate-900 dark:text-white mb-2 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors line-clamp-2">
                            ${link.title}
                        </h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 truncate mt-auto">
                            ${link.url}
                        </p>
                    `;
                    gridElement.appendChild(card);
                });
            }
        }

        // 検索イベント (インクリメンタルサーチ)
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderLinks();
        });

        // タブ切り替えイベント
        tabButtons.forEach(button => {
            button.addEventListener('click', () => {
                currentCategory = button.getAttribute('data-category');
                
                // アクティブ状態のスタイリング更新
                tabButtons.forEach(btn => {
                    if (btn === button) {
                        btn.className = 'tab-btn active px-4 py-2 text-sm font-medium rounded-full bg-indigo-600 text-white whitespace-nowrap transition-colors';
                    } else {
                        btn.className = 'tab-btn px-4 py-2 text-sm font-medium rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600 whitespace-nowrap transition-colors';
                    }
                });
                
                renderLinks();
            });
        });

        const themeToggleBtn = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        // ダークモードの状態を切り替える
        function toggleTheme() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.theme = 'light';
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            } else {
                html.classList.add('dark');
                localStorage.theme = 'dark';
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            }
        }

        themeToggleBtn.addEventListener('click', toggleTheme);

        // 初期ロード時のテーマとデータ描画
        function init() {
            // OS設定やlocalStorageに基づくテーマの初期設定
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
            
            // リンクの初回描画
            renderLinks();
        }

        init();
    </script>
